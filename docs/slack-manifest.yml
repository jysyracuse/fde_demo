display_information:
  name: AR Followup
  description: Overdue and failed-charge follow-up assistant (demo)
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: AR Followup
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:read
      - channels:history
      - users:read
      - users:read.email
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
